name: build-packages

on:
  schedule:
    # Every 12 hours (offset to avoid the busy top-of-hour GitHub window)
    - cron: "23 */12 * * *"
  push:
    branches: [main]
    paths:
      - "*/PKGBUILD"
      - "**/*.patch"
      - "build-order"
      - "github-ci/scripts/**"
      - "github-ci/shims/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Package dir(s) to build exactly as listed, comma-separated, e.g. nemo-git or slick-greeter,arena-git. Ignored if force_all is set."
        required: false
        default: ""
      force_all:
        description: "Build everything in build-order regardless of upstream changes"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      packages: ${{ steps.check.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          SINGLE_PACKAGE: ${{ inputs.package || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash github-ci/scripts/check_upstream.sh

  build:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git MUST exist before actions/checkout, otherwise checkout falls back
      # to a REST tarball download WITHOUT .git and the later .upstream ref
      # commits find no git repository.
      - name: Prepare container (git first, build user, deps)
        run: |
            # Configure [prince] repo so previously-published packages are available
            # as installed dependencies for incremental builds (avoids full rebuilds)
            # Put [prince] FIRST so pacman prefers our packages over official repos
            {
                echo "[prince]"
                echo "SigLevel = Never"
                echo "Server = https://princepaul.github.io/arch-repo/"
                echo ""
                cat /etc/pacman.conf
            } > /tmp/pacman.conf.new
            mv /tmp/pacman.conf.new /etc/pacman.conf
            pacman -Syu --noconfirm git sudo github-cli zstd
            # Install all [prince] packages so makepkg --syncdeps finds them
            pacman -S --noconfirm --needed $(pacman -Slq prince 2>/dev/null) 2>/dev/null || true
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Hand the workspace to builder
        run: chown -R builder:builder .

      - name: Build + install AUR-only dependency shims
        run: |
            shopt -s nullglob
            pks=()
            for sd in github-ci/shims/*/; do
                [[ -d "$sd" ]] || continue
                ( cd "$sd" && sudo -u builder -H makepkg --noconfirm -f ) && pks+=("$sd"*.pkg.tar.zst)
            done
            shopt -u nullglob
            if [[ ${#pks[@]} -eq 0 ]]; then
                echo "No dependency shims configured."
            else
                sudo pacman -U --noconfirm "${pks[@]}"
            fi

            # pysassc (AUR python-libsass frontend) - used by mint-themes /
            # mint-y-icons upstream scripts to regenerate theme CSS from scss.
            # base-devel does not include python, so install it first.
            sudo pacman -S --noconfirm python python-pip
            sudo mkdir -p /opt/pysassc
            sudo chown builder:builder /opt/pysassc
            sudo -u builder -H python -m venv /opt/pysassc
            sudo /opt/pysassc/bin/pip install --quiet libsass || true
            if [[ -x /opt/pysassc/bin/pysassc ]]; then
                sudo ln -sf /opt/pysassc/bin/pysassc /usr/local/bin/pysassc
                echo "pysassc installed: $(/usr/local/bin/pysassc --version)"
            else
                echo "WARNING: pysassc not available; mint-themes will use pre-generated CSS" >&2
            fi



      - name: Build changed packages + dependents
        env:
          PKGS: ${{ needs.check.outputs.packages }}
        run: sudo -u builder -H env PKGS="$PKGS" bash github-ci/scripts/build_ci.sh

      - name: Upload artifacts (also kept as run artifacts)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Publish pacman repo to 'packages' branch (Pages)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash github-ci/scripts/publish_repo.sh

      - name: Publish to rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
            cd "${GITHUB_WORKSPACE}/dist"
            shopt -s nullglob
            files=(./*.pkg.tar.zst)
            shopt -u nullglob
            if [[ ${#files[@]} -eq 0 ]]; then
                echo "ERROR: no packages in dist; cannot publish release" >&2
                exit 1
            fi
            gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest packages" --notes "Rolling release of locally built packages (git versions). Overwritten on every successful build. The authoritative pacman repo is the 'packages' branch / GitHub Pages."
            gh release upload latest ./*.pkg.tar.zst ./prince.db.tar.gz ./prince.files.tar.gz ./SHA256SUMS --clobber

      - name: Commit updated .upstream refs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            WS="${GITHUB_WORKSPACE}"
            cd "$WS"
            sudo -u builder -H git config user.name "github-actions[bot]"
            sudo -u builder -H git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [[ -n "$(sudo -u builder -H git status --porcelain -- .upstream)" ]]; then
                sudo -u builder -H git add .upstream
                sudo -u builder -H git commit -m "chore: update upstream refs [skip ci]"
                AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
                sudo -u builder env AUTH="$AUTH" WS="$WS" bash -c '
                    cd "$WS"
                    for attempt in 1 2 3 4 5; do
                        echo "Push attempt $attempt..."
                        git fetch origin main 2>/dev/null || true
                        if git rebase origin/main >/dev/null 2>&1; then
                            if git -c "http.extraHeader=Authorization: Basic $AUTH" \
                                push origin "HEAD:refs/heads/main"; then
                                echo "Pushed upstream refs on attempt $attempt."
                                exit 0
                            fi
                        else
                            git rebase --abort >/dev/null 2>&1 || true
                            echo "Rebase had conflicts; aborting this push (refs will retry next run)."
                            exit 0
                        fi
                        echo "Push attempt $attempt failed; retrying..."
                        sleep 2
                    done
                    echo "WARNING: could not push upstream refs after 5 attempts; will retry next run." >&2
                    exit 0
                '
            else
                echo "No upstream ref changes to commit."
            fi

  cleanup:
    name: Cleanup old workflow runs
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than the latest successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
            if [[ "$BUILD_RESULT" != "success" ]]; then
                echo "Build result: $BUILD_RESULT -- keeping all runs for analysis."
                exit 0
            fi

            current_id="${{ github.run_id }}"
            echo "Build succeeded. Cleaning up old runs (keeping current: $current_id)..."

            mapfile -t run_ids < <(gh api "repos/${GH_REPO}/actions/runs?per_page=100" \
                --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')

            latest_success=$(gh api "repos/${GH_REPO}/actions/runs?per_page=100" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .id')

            echo "Latest successful run: $latest_success"

            deleted=0
            for rid in "${run_ids[@]}"; do
                if [[ "$rid" == "$current_id" || "$rid" == "$latest_success" ]]; then
                    echo "  Keep: $rid"
                    continue
                fi
                echo "  Delete: $rid"
                gh api -X DELETE "repos/${GH_REPO}/actions/runs/$rid" >/dev/null 2>&1 || true
                deleted=$((deleted + 1))
            done

            echo "Deleted $deleted old run(s)."
