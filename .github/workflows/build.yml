name: build-packages

on:
  schedule:
    # Every 12 hours (offset to avoid the busy top-of-hour GitHub window)
    - cron: "23 */12 * * *"
  push:
    branches: [main]
    paths:
      - "*/PKGBUILD"
      - "**/*.patch"
      - "build-order"
      - "github-ci/scripts/**"
      - "github-ci/shims/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Package dir(s) to build exactly as listed, comma-separated, e.g. nemo-git or slick-greeter,arena-git. Ignored if force_all is set."
        required: false
        default: ""
      force_all:
        description: "Build everything in build-order regardless of upstream changes"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  # Promote staging to packages branch at start (for resume capability)
  promote-staging:
    name: Promote packages-staging → packages
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Check if packages-staging exists and has changes
        id: check_staging
        run: |
            # Check if packages-staging branch exists on remote
            if git ls-remote --heads "https://github.com/${{ github.repository }}.git" "packages-staging" | grep -q packages-staging; then
                echo "staging_exists=true" >> "$GITHUB_OUTPUT"
            else
                echo "staging_exists=false" >> "$GITHUB_OUTPUT"
            fi
      - name: Promote staging to packages
        id: promote
        if: steps.check_staging.outputs.staging_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
            echo "Promoting packages-staging to packages..."
            
            # Clone packages branch
            work="$(mktemp -d)"
            git clone --branch packages --single-branch --depth 1 "https://github.com/${GH_REPO}.git" "$work"
            cd "$work"
            
            # Fetch and merge packages-staging
            git fetch origin packages-staging:packages-staging
            git merge --no-edit packages-staging || {
                echo "Merge conflict - manual intervention needed"
                exit 1
            }
            
            # Rebuild repo database
            repo-add --quiet prince.db.tar.gz ./*.pkg.tar.zst
            rm -f prince.db prince.files
            cp -f prince.db.tar.gz prince.db
            cp -f prince.files.tar.gz prince.files
            
            # Commit and push
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -am "Promote packages-staging → packages [skip ci]"
            
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraHeader=Authorization: Basic $AUTH" \
                push origin "HEAD:refs/heads/packages"
            
            echo "promoted=true" >> "$GITHUB_OUTPUT"

  check:
    needs: promote-staging
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      packages: ${{ steps.check.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          SINGLE_PACKAGE: ${{ inputs.package || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash github-ci/scripts/check_upstream.sh

  build:
    needs: [check, promote-staging]
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git MUST exist before actions/checkout, otherwise checkout falls back
      # to a REST tarball download WITHOUT .git and the later .upstream ref
      # commits find no git repository.
      - name: Prepare container (git first, build user, deps)
        run: |
            # Configure [prince] repo so previously-published packages are available
            # as installed dependencies for incremental builds (avoids full rebuilds)
            # Put [prince] FIRST so pacman prefers our packages over official repos
            {
                echo "[prince]"
                echo "SigLevel = Never"
                echo "Server = https://princepaul.github.io/arch-repo/"
                echo ""
                cat /etc/pacman.conf
            } > /tmp/pacman.conf.new
            mv /tmp/pacman.conf.new /etc/pacman.conf
            pacman -Syu --noconfirm git sudo github-cli zstd
            # Install glib2-devel for glib-mkenums and other GLib build tools
            pacman -S --noconfirm --needed glib2-devel
            # Install all [prince] packages so makepkg --syncdeps finds them
            pacman -S --noconfirm --needed $(pacman -Slq prince 2>/dev/null) 2>/dev/null || true
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Hand the workspace to builder
        run: chown -R builder:builder .

      - name: Build + install AUR-only dependency shims
        run: |
            shopt -s nullglob
            pks=()
            for sd in github-ci/shims/*/; do
                [[ -d "$sd" ]] || continue
                ( cd "$sd" && sudo -u builder -H makepkg --noconfirm -f ) && pks+=("$sd"*.pkg.tar.zst)
            done
            shopt -u nullglob
            if [[ ${#pks[@]} -eq 0 ]]; then
                echo "No dependency shims configured."
            else
                sudo pacman -U --noconfirm "${pks[@]}"
            fi

            # pysassc (AUR python-libsass frontend) - used by mint-themes /
            # mint-y-icons upstream scripts to regenerate theme CSS from scss.
            # base-devel does not include python, so install it first.
            sudo pacman -S --noconfirm python python-pip
            sudo mkdir -p /opt/pysassc
            sudo chown builder:builder /opt/pysassc
            sudo -u builder -H python -m venv /opt/pysassc
            sudo /opt/pysassc/bin/pip install --quiet libsass || true
            if [[ -x /opt/pysassc/bin/pysassc ]]; then
                sudo ln -sf /opt/pysassc/bin/pysassc /usr/local/bin/pysassc
                echo "pysassc installed: $(/usr/local/bin/pysassc --version)"
            else
                echo "WARNING: pysassc not available; mint-themes will use pre-generated CSS" >&2
            fi


      - id: build
        name: Build changed packages + dependents
        env:
          PKGS: ${{ needs.check.outputs.packages }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sudo -u builder -H env PKGS="$PKGS" GH_TOKEN="$GH_TOKEN" GH_REPO="$GH_REPO" bash github-ci/scripts/build_ci.sh
          if [[ -f .built_dirs ]]; then
            echo "built_dirs=$(tr '\n' ' ' < .built_dirs | xargs)" >> "$GITHUB_OUTPUT"
          elif [[ -f dist/.built_dirs ]]; then
            echo "built_dirs=$(tr '\n' ' ' < dist/.built_dirs | xargs)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts (also kept as run artifacts)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Prepare db files and checksums for release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: DIST_DIR="${GITHUB_WORKSPACE}/dist" bash github-ci/scripts/publish_repo.sh --no-push

      - name: Push packages branch to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: DIST_DIR="${GITHUB_WORKSPACE}/dist" bash github-ci/scripts/publish_repo.sh

      - name: Publish to rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
            cd "${GITHUB_WORKSPACE}/dist"
            shopt -s nullglob
            files=(./*.pkg.tar.zst)
            shopt -u nullglob
            if [[ ${#files[@]} -eq 0 ]]; then
                echo "ERROR: no packages in dist; cannot publish release" >&2
                exit 1
            fi
            gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest packages" --notes "Rolling release of locally built packages (git versions). Overwritten on every successful build. The authoritative pacman repo is the 'packages' branch / GitHub Pages."
            gh release upload latest ./*.pkg.tar.zst ./prince.db.tar.gz ./prince.files.tar.gz ./SHA256SUMS --clobber

      - name: Update .upstream refs via GitHub API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
            WS="${GITHUB_WORKSPACE}"
            cd "$WS"
            
            # Read list of actually built packages from build step output or file
            built_dirs_str="${{ steps.build.outputs.built_dirs }}"
            if [[ -z "$built_dirs_str" && -f .built_dirs ]]; then
                built_dirs_str="$(tr '\n' ' ' < .built_dirs | xargs)"
            fi
            if [[ -z "$built_dirs_str" && -f dist/.built_dirs ]]; then
                built_dirs_str="$(tr '\n' ' ' < dist/.built_dirs | xargs)"
            fi
            if [[ -z "$built_dirs_str" ]]; then
                echo "No built packages tracked; skipping ref update."
                exit 0
            fi
            
            # Split the string into array (space-separated)
            read -ra built_dirs <<< "$built_dirs_str"
            if [[ ${#built_dirs[@]} -eq 0 ]]; then
                echo "No packages built; skipping ref update."
                exit 0
            fi
            
            echo "Updating ${#built_dirs[@]} upstream refs via GitHub API for built packages..."
            
            for dir in "${built_dirs[@]}"; do
                filename="${dir//\//_}"
                f=".upstream/${filename}"
                if [[ ! -f "$f" ]]; then
                    echo "  Warning: ref file $f not found, skipping"
                    continue
                fi
                content="$(cat "$f")"
                encoded="$(printf '%s' "$content" | base64 -w0)"
                
                # Get current file SHA if exists
                sha="$(gh api "repos/${GH_REPO}/contents/.upstream/${filename}?ref=main" --jq '.sha' 2>/dev/null || echo '')"
                
                if [[ -n "$sha" ]]; then
                    # Update existing file
                    gh api -X PUT "repos/${GH_REPO}/contents/.upstream/${filename}"                         -f message="chore: update upstream ref for ${filename} [skip ci]"                         -f content="$encoded"                         -f sha="$sha"                         -f branch=main                         >/dev/null
                    echo "  Updated: ${filename}"
                else
                    # Create new file
                    gh api -X PUT "repos/${GH_REPO}/contents/.upstream/${filename}"                         -f message="chore: add upstream ref for ${filename} [skip ci]"                         -f content="$encoded"                         -f branch=main                         >/dev/null
                    echo "  Created: ${filename}"
                fi
            done
            
            echo "All upstream refs updated via API."

  cleanup:
    name: Cleanup old workflow runs
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than the latest successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
            if [[ "$BUILD_RESULT" != "success" ]]; then
                echo "Build result: $BUILD_RESULT -- keeping all runs for analysis."
                exit 0
            fi

            current_id="${{ github.run_id }}"
            echo "Build succeeded. Cleaning up old runs (keeping only latest successful: $current_id)..."

            # Clean up build-packages runs
            mapfile -t build_run_ids < <(gh api "repos/${GH_REPO}/actions/runs?per_page=100"  \
                --jq '.workflow_runs[] | select(.workflow_id == 396611019) | sort_by(.created_at) | reverse | .id')

            # Keep only the current run (which is the latest successful), delete all others
            deleted=0
            for rid in "${build_run_ids[@]}"; do
                if [[ "$rid" == "$current_id" ]]; then
                    echo "  Keep: $rid (current build-packages run)"
                    continue
                fi
                echo "  Delete: $rid (build-packages)"
                gh api -X DELETE "repos/${GH_REPO}/actions/runs/$rid" >/dev/null 2>&1 || true
                deleted=$((deleted + 1))
            done

            # Clean up pages-build-deployment runs (keep only latest)
            mapfile -t pages_run_ids < <(gh api "repos/${GH_REPO}/actions/runs?per_page=100"  \
                --jq '.workflow_runs[] | select(.workflow_name == "pages-build-deployment") | sort_by(.created_at) | reverse | .id')

            if [[ ${#pages_run_ids[@]} -gt 0 ]]; then
                latest_pages="${pages_run_ids[0]}"
                echo "  Keeping latest pages-build-deployment: $latest_pages"
                for rid in "${pages_run_ids[@]:1}"; do
                    echo "  Delete: $rid (pages-build-deployment)"
                    gh api -X DELETE "repos/${GH_REPO}/actions/runs/$rid" >/dev/null 2>&1 || true
                    deleted=$((deleted + 1))
                fi
            fi

            echo "Deleted $deleted old run(s)."